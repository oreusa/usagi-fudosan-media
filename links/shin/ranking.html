",""],["和泉市","/machi/osaka-61","この街の家と土地の値段",""],["高石市","/machi/osaka-62","この街の家と土地の値段",""],["貝塚市","/machi/osaka-66","この街の家と土地の値段",""]],"lh":"出てくる街のくわしいページ","lnote":""},{"t":"兵庫の観光地　清荒神と伊弉諾神宮、2位と3位が入れ替わり","p":"兵庫","k":"hoka","d":"11/10","body":"清荒神は1年で38.5万人増えて2位に！\n\n 上位5か所\n　・1位 阪神甲子園球場（西宮市）417.2万人\n　・2位 清荒神清澄寺（宝塚市）284.5万人\n　・3位 伊弉諾神宮（淡路市）283.4万人\n　・4位 西宮神社（西宮市）240.1万人\n　・5位 明石公園（明石市）225.9万人\n\n 前の年の2位・3位\n　・2位 伊弉諾神宮 268.7万人\n　・3位 清荒神清澄寺 246.0万人\n\n兵庫県が11/2に発表した、\n令和7年度の観光客動態調査の速報です。\n2025年4月〜2026年3月の、\n施設ごとの、のべの入込客数。\n\n数字を見ると、\n2位と3位の差は、たった1.1万人。\n4位と5位も、西宮神社と明石公園が\n入れ替わっていました。\n上位5か所のうち2か所が、西宮市です。\n\n 速報値のため、あとで変わることがあります","u":"https://web.pref.hyogo.lg.jp/sr16/press/20261102.html","ub":"出どころの公式ページ","nomap":1,"id":"2026-11-10-e60d","links":[["西宮市","/machi/hyogo-11","この街の家と土地の値段",""],["宝塚市","/machi/hyogo-14","この街の家と土地の値段",""],["明石市","/machi/hyogo-18","この街の家と土地の値段",""],["淡路市","/machi/hyogo-47","この街の家と土地の値段",""]],"lh":"出てくる街のくわしいページ","lnote":""},{"t":"宝塚市の住宅地　1位は仁川北2丁目28.7万円/㎡","p":"関西","k":"eki","d":"11/9","body":"2位の南口1丁目は、1年で+4.0%！\n\n阪急の駅が並ぶ宝塚市。\n今日は土地の値段を調べました。\n県の基準地（住宅地）16地点を、\n1㎡の価格の順に並べました。\n\n 1位 仁川北2丁目\n　・27.7万円→28.7万円（+3.6%）\n\n 2位 南口1丁目\n　・27.3万円→28.4万円（+4.0%）\n\n 3位 千種1丁目\n　・21.4万円→21.8万円（+1.9%）\n\n並べてみると、1位と2位の差は\n1㎡あたり3,000円でした。\n+4.0%は、16地点の中で最も大きい変動率です。\n16地点のうち、0.0%の横ばいは2地点。\n下がったのは玉瀬の1地点（-0.7%）だけでした。\nご実家のある町の数字とも、見くらべてみてください。\n\n 基準地は目安。一つひとつの土地の値段とは別","u":"https://web.pref.hyogo.lg.jp/ks21/documents/r8chika-hikaku.pdf","ub":"出どころの公式ページ","nomap":1,"id":"2026-11-09-73bf","links":[["宝塚市","/machi/hyogo-14","この街の家と土地の値段",""]],"lh":"出てくる街のくわしいページ","lnote":""},{"t":"大阪府　人口の増加率、確定値で2位が島本町に","p":"大阪","k":"hito","d":"11/9","body":"速報3位の島本町が、確定値で吹田市を抜いて2位に！\n\n2025年国勢調査の、大阪府の確定値です。\n9月29日に府が公表しました。\n2020年から人口が増えたのは、6市1町。\n\n 増加率の順位\n　・1位 箕面市：+2.83%\n　・2位 島本町：+2.61%\n　・3位 吹田市：+2.32%\n\n 5月22日の速報では\n　・1位 箕面市：+2.72%\n　・2位 吹田市：+2.32%\n　・3位 島本町：+2.23%\n\n 増加数の順位（確定値）\n　・1位 大阪市：+52,959人\n　・2位 吹田市：+8,949人\n　・3位 箕面市：+3,868人\n\n島本町は、確定値で率が上がって2位に。\n吹田市と入れ替わっていました。\n並べ直してみて、ここがいちばん意外でした。\n\n 速報と確定では、同じ調査でも数字が変わります","u":"https://www.pref.osaka.lg.jp/hodo/fumin/o040090/prs_51268.html","ub":"出どころの公式ページ","nomap":1,"id":"2026-11-09-0b0c","links":[["箕面市","/machi/osaka-34","この街の家と土地の値段",""],["吹田市","/machi/osaka-37","この街の家と土地の値段",""],["島本町","/machi/osaka-41","この街の家と土地の値段",""]],"lh":"出てくる街のくわしいページ","lnote":""},{"t":"南海本線 泉州25駅　1位泉大津25,313人、岸和田は4位","p":"関西","k":"eki","d":"11/9","body":"岸和田より上に、3つの駅がありました！\n\n 1位 泉大津 25,313人\n 2位 泉佐野 23,227人\n 3位 羽衣 20,416人\n 4位 岸和田 19,488人\n 5位 貝塚 17,822人\n\n南海電鉄が出している、\n2024年度の1日平均の乗降人員です。\n羽衣から孝子まで、\n高石市〜岬町の25駅でくらべました。\n\n前の年からいちばん増えたのは泉佐野。\n21,968人から23,227人へ、\n1年で1,259人増えています。\n1位の泉大津との差は、\n2,894人から2,086人に縮まりました。\n\nもうひとつの発見は、14位と15位。\n蛸地蔵が4,388人、二色浜が4,385人で、\n差はたった3人。\n前の年も21人差の、近い2駅です。\n\n25駅のうち19駅で、\n前の年より乗り降りが増えています。\n駅の乗り降りは、街の人の動きの目安のひとつ。\n調べるまで、岸和田が4位とは知りませんでした。\n\n 空港線のりんくうタウン・関西空港は入れていません","u":"https://www.nankai.co.jp/lib/company/handbook/pdf/handbook2025.pdf","ub":"出どころの公式ページ","nomap":1,"id":"2026-11-09-00c2","links":[["高石市","/machi/osaka-62","この街の家と土地の値段",""],["岬町","/machi/osaka-72","この街の家と土地の値段",""]],"lh":"出てくる街のくわしいページ","lnote":""},{"t":"京都府の阪急15駅　西院が桂を抜いて3位、差は552人","p":"京都","k":"eki","d":"11/8","body":"1位は烏丸の80,522人。阪急の全駅でも4位です。\n\n 1位 烏丸 80,522人\n 2位 京都河原町 71,257人\n 3位 西院 39,309人\n 4位 桂 38,757人\n 5位 大宮 24,900人\n\n阪急が出している、2025年の\n駅別乗降人員（通年平均）です。\n\n前の年は、桂が38,441人で3位、\n西院が37,635人で4位でした。\n1年で西院は1,674人増えて、\n桂を抜いています。\n差は552人。\n西院がここまで伸びていたのは意外でした。\n\n阪急の全駅の順位でも、\n西院は21位から18位へ。\n西院は、烏丸から大宮をはさんで\n2つ目の駅です。\n\n烏丸は京都河原町より9,265人多く、\n2年続けて京都府内の1位です。\n府内の15駅のうち、\n14駅で前の年より増えました。\n\n 数字は阪急の資料の「2025年 通年平均」です","u":"https://www.hankyu.co.jp/station/passenger/index.html","ub":"出どころの公式ページ","nomap":1,"id":"2026-11-08-f982","links":[],"lh":"出てくる街のくわしいページ","lnote":""},{"t":"宝塚市の阪急駅　2位は逆瀬川、前の年は仁川","p":"関西","k":"eki","d":"11/7","body":"1位は宝塚駅の38,480人。2位と3位が、1年で入れ替わりました\n\n阪急電鉄の2024年の駅別乗降人員（通年平均）で、\n宝塚市内にある阪急の10駅を並べました。\n毎日使う駅の、人の流れが見える数字です。\n\n 1位 宝塚：38,480人\n 2位 逆瀬川：21,480人\n 3位 仁川：20,375人\n 4位 山本：15,585人\n 5位 小林：12,879人\n\n 2023年の2位と3位\n　・仁川：21,619人\n　・逆瀬川：21,445人\n\n2023年の差は、たった174人。\nそこから入れ替わったのが意外でした。\n2024年は、逆瀬川と仁川の差が1,105人です。\n\n宝塚駅の38,480人は、\nとなりの川西市の川西能勢口駅（38,538人）とほぼ同じ。\n差は58人です。\n\n 川西能勢口は能勢電鉄線内の発着をふくまない数字","u":"https://www.hankyu.co.jp/station/passenger/passenger_2024.html","ub":"出どころの公式ページ","nomap":1,"id":"2026-11-07-6bce","links":[["宝塚市","/machi/hyogo-14","この街の家と土地の値段",""],["川西市","/machi/hyogo-15","この街の家と土地の値段",""]],"lh":"出てくる街のくわしいページ","lnote":""},{"t":"実家の区は何位？　大阪市の住宅地、1位は浪速区+10.9%","p":"大阪","k":"ie","d":"11/7","body":"今年1月1日時点の地価公示で、24区すべてが前の年よりプラスです。\n\n 1位 浪速区 +10.9%\n 2位 西区 +10.5%\n 3位 北区 +9.2%\n 4位 城東区 +8.9%\n 5位 鶴見区 +8.8%\n\n+の数字は、前の年からの上がり幅です。\n浪速区は、前の年も+9.7%で1位。\n西区は+8.4%から+10.5%へ。\n+10%を超えたのは、この2区です。\n\n大阪市の平均は+6.5%でした。\n24位の平野区も+3.9%で、\n前の年の+2.4%から広がっています。\n\n阿倍野区は+7.3%から+6.9%へ。\n上がり幅が縮んだのは24区で1区だけ。\nこれは意外でした。\n\n 区の平均で、ご実家の値段そのものではありません","u":"https://www.pref.osaka.lg.jp/documents/125605/houdour8_1.pdf","ub":"出どころの公式ページ","nomap":1,"id":"2026-11-07-3fe6","links":[],"lh":"出てくる街のくわしいページ","lnote":""},{"t":"和歌山30市町村　住宅地の平均、町で1位は有田川町2.73万円","p":"和歌山","k":"ie","d":"11/7","body":"ご実家の町は何位？ 上位10のうち、3つが町でした。\n\n 1位 和歌山市 7.43万円/㎡\n 2位 海南市 4.19万円/㎡\n 3位 岩出市 3.97万円/㎡\n 4位 新宮市 3.61万円/㎡\n 5位 田辺市 3.51万円/㎡\n\n令和8年の和歌山県地価調査（7月1日時点）。\n住宅地の、1㎡あたりの平均価格です。\n\n6位 橋本市、7位 有田市のあとに、\n8位 有田川町 2.73万円/㎡。\n9位 上富田町 2.68万円/㎡。\n10位 湯浅町 2.59万円/㎡。\n町が3つ続いたのは、意外でした。\n\n白浜町・串本町も、11位・12位。\n市の御坊市（13位・2.29万円/㎡）より前です。\n\n県の平均は3.53万円/㎡。\n変動率は−0.5%で、前の年の−0.6%から幅が小さくなりました。\n30市町村のうちプラスは和歌山市（+0.2%）でした。\n\n 市町村ごとの平均です。一軒ごとの価格とは別です","u":"https://www.pref.wakayama.lg.jp/prefg/022200/tochi/tikatyousa/r6/d00222968_d/fil/3-kekkagaiyou.pdf","ub":"出どころの公式ページ","nomap":1,"id":"2026-11-07-eeba","links":[["和歌山市","/machi/wakayama-01","この街の家と土地の値段",""],["有田川町","/machi/wakayama-14","この街の家と土地の値段",""],["上富田町","/machi/wakayama-19","この街の家と土地の値段",""],["海南市","/machi/wakayama-02","この街の家と土地の値段",""],["橋本市","/machi/wakayama-03","この街の家と土地の値段",""],["有田市","/machi/wakayama-04","この街の家と土地の値段",""]],"lh":"出てくる街のくわしいページ","lnote":""},{"t":"京都市11区　人口の増加率1位は下京区＋2.0%","p":"京都","k":"hito","d":"11/6","body":"5年で人が増えたのは、11区のうち3区でした\n\n令和7年国勢調査の確定値（9月29日公表）で、\n5年前の令和2年からの増加率を区ごとに並べました。\n\n 1位 下京区：+2.0%（+1,626人）\n 2位 中京区：+0.7%（+743人）\n 3位 南区：+0.7%（+683人）\n\n 5月の速報からの動き\n　・下京区：84,519人→84,410人（−109人）\n　・中京区：111,400人→111,231人（−169人）\n　・南区：102,742人→102,653人（−89人）\n\n速報では、下京区は+2.1%、中京区は+0.8%でした。\n京都市全体は、速報から1,651人少ない数字に。\n確定値の京都市の人口は1,430,062人です。\n\nニュースで見た人口も、あとで少し直ることがあります。\nだから数字は、いつの発表かといっしょに見ると安心。\n実家のある区やお住まいの区も、11区の表で見られます。\n\n 増加率は公表どおり小数第1位まで","u":"https://www.city.kyoto.lg.jp/sogo/cmsfiles/contents/0000358/358071/siryo.pdf","ub":"出どころの公式ページ","nomap":1,"id":"2026-11-06-1ec3","links":[],"lh":"出てくる街のくわしいページ","lnote":""},{"t":"北摂に実家があるなら　住宅地の上がり幅1位は吹田市+4.9%","p":"関西","k":"ie","d":"11/6","body":"1月1日時点の地価公示で、北摂の10市町のうち8市町がプラスでした。\n\n 1位 吹田市 +4.9%\n 2位 豊中市 +4.0%\n 3位 茨木市 +3.8%\n 4位 高槻市 +3.7%\n 5位 摂津市 +3.4%\n\n吹田市は、前の年の+4.3%からさらに上向き。\n豊中市も+3.7%から+4.0%へ。\n茨木市・高槻市・摂津市は、\n前の年より1ポイント以上広がりました。\n茨木市は+2.6%から+3.8%へ。\n\n箕面市と島本町は、同じ+2.9%で6位。\n池田市は+1.1%から+2.1%へ。\nプラスの8市町は、どこも前の年より\n上がり幅が広がっています。\n\n豊能町は−0.7%、能勢町は−1.1%。\n2つの町は、前の年に続いてマイナスでした。\n\n 市町ごとの平均です。一軒ごとの価格とは別です","u":"https://www.pref.osaka.lg.jp/documents/125605/houdour8_1.pdf","ub":"出どころの公式ページ","nomap":1,"id":"2026-11-06-3595","links":[["能勢町","/machi/osaka-32","この街の家と土地の値段",""],["豊能町","/machi/osaka-33","この街の家と土地の値段",""],["箕面市","/machi/osaka-34","この街の家と土地の値段",""],["池田市","/machi/osaka-35","この街の家と土地の値段",""],["豊中市","/machi/osaka-36","この街の家と土地の値段",""],["吹田市","/machi/osaka-37","この街の家と土地の値段",""]],"lh":"出てくる街のくわしいページ","lnote":""},{"t":"神戸市9区　住宅地の上がり幅、2年続けて1位は中央区+5.9%","p":"関西","k":"ie","d":"11/6","body":"神戸市の9区、すべてプラスでした！\n\n 1位 中央区 +5.9%\n 2位 東灘区 +4.9%\n 3位 灘区 +4.6%\n 4位 西区 +3.8%\n 5位 兵庫区 +3.1%\n\n2026年の兵庫県地価調査（7月1日時点）です。\n中央区は、前の年と同じ+5.9%で1位。\n東灘区・灘区も+4%台が続きます。\n\n上がり幅が広がったのは、3つの区。\n灘区は+4.5%から+4.6%へ。\n西区は+3.4%から+3.8%へ。\n長田区は+1.2%から+1.6%へ。\n\n兵庫区は前の年と同じ+3.1%。\n須磨区・北区・垂水区は、\n前の年より少し小さい上がり幅でした。\n北区・垂水区は+2%台、須磨区は+2.7%です。\n9区とも、前の年に続いてプラスです。\n\n 区ごとの平均です。一軒ごとの価格とは別です","u":"https://web.pref.hyogo.lg.jp/ks21/documents/r8chika-gaikyo.pdf","ub":"出どころの公式ページ","nomap":1,"id":"2026-11-06-a188","links":[],"lh":"出てくる街のくわしいページ","lnote":""},{"t":"南河内6市　30〜40代の割合、1位は大阪狭山市 22.6%","p":"大阪","k":"hito","d":"11/5","body":"6市で人口がいちばん少ない市が、1位でした！\n\n 1位 大阪狭山市 22.6%\n　・30〜40代 12,989人／人口 57,559人\n\n 2位 藤井寺市 21.5%\n　・30〜40代 13,084人／人口 60,796人\n\n 3位 松原市 21.4%\n　・30〜40代 24,516人／人口 114,427人\n\n人数でいちばん多いのは松原市。\n割合で見ると、順番が入れかわります。\n2位の藤井寺市と3位の松原市は、どちらも21%台。\n\n子ども（0〜9歳）の数もくらべてみました。\n大阪狭山市は4,770人。\n藤井寺市は人口が3,237人多いのに、3,927人。\n大阪狭山市のほうが843人多いです。\n\n 30〜40代は30〜49歳の合計。割合は各市の総数で割って計算しています","u":"https://www.pref.osaka.lg.jp/documents/12055/202609suikei5sai.pdf","ub":"出どころの公式ページ","nomap":1,"id":"2026-11-05-a2a8","links":[["大阪狭山市","/machi/osaka-55","この街の家と土地の値段",""],["藤井寺市","/machi/osaka-53","この街の家と土地の値段",""],["松原市","/machi/osaka-52","この街の家と土地の値段",""]],"lh":"出てくる街のくわしいページ","lnote":""},{"t":"滋賀19市町　住宅地の上がり幅 上位は草津市＋4.5%","p":"滋賀","k":"ie","d":"11/4","body":"今年の地価調査、上がった市が7つありました！\n\n 上がり幅の上位（住宅地の平均）\n　・草津市 ＋4.5%・平均109,000円/㎡\n　・守山市 ＋3.6%・平均99,700円/㎡\n　・野洲市 ＋3.1%・平均76,100円/㎡\n\n草津市の平均は、県の平均50,100円/㎡の約2倍です。\n県全体は＋0.6%（前年＋0.2%）でした。\n\n続いて栗東市＋2.6%、大津市＋2.2%、近江八幡市＋0.7%、彦根市＋0.3%。\n多賀町は0.0%、ほかの11市町は▲0.3〜▲1.9%。\n\n 6町の住宅地の平均価格は 9,200〜27,300円/㎡で、約3倍の幅がありました\n\n 平均の数字で、一軒ごとの価格とは別です\n\nご自分の市町の数字は、県の第4-1表で見られます。\n次に調べてほしい市町があれば、返信で教えてください。","u":"https://www.pref.shiga.lg.jp/documents/2085/20260917160007.pdf","ub":"出どころの公式ページ","nomap":1,"id":"2026-11-04-d39c","links":[["近江八幡市","/machi/shiga-04","この街の家と土地の値段",""],["大津市","/machi/shiga-01","この街の家と土地の値段",""],["彦根市","/machi/shiga-02","この街の家と土地の値段",""],["草津市","/machi/shiga-05","この街の家と土地の値段",""],["守山市","/machi/shiga-06","この街の家と土地の値段",""],["栗東市","/machi/shiga-07","この街の家と土地の値段",""]],"lh":"出てくる街のくわしいページ","lnote":""},{"t":"泉州に実家があるなら　住宅地の上がり幅1位は高石市+3.4%","p":"関西","k":"ie","d":"11/4","body":"上がったのは7市町、下がったのは5市町です！\n\n 1位 高石市 +3.4%\n 2位 泉大津市 +1.6%\n 3位 和泉市 +1.3%\n 4位 岸和田市・泉佐野市 +0.9%\n 6位 田尻町 +0.5%\n\n堺市をのぞく泉州12市町の住宅地です。\n高石市は、前の年の+3.2%からさらに上向き。\n上位3市は、どこも前の年より上がり幅が大きくなりました。\n泉佐野市は+0.7%から+0.9%へ。\n田尻町も+0.1%から+0.5%へ。\n\nマイナスは貝塚市・泉南市・阪南市・熊取町・岬町。\n岬町は前の年の−3.4%から−2.8%へ。\n下がり方は小さくなりました。\n\n 市町ごとの平均です。家の値段は場所や建物で変わります","u":"https://www.pref.osaka.lg.jp/documents/125605/houdour8_1.pdf","ub":"出どころの公式ページ","nomap":1,"id":"2026-11-04-b926","links":[["泉大津市","/machi/osaka-63","この街の家と土地の値段",""],["岸和田市","/machi/osaka-65","この街の家と土地の値段",""],["泉佐野市","/machi/osaka-67","この街の家と土地の値段",""],["和泉市","/machi/osaka-61","この街の家と土地の値段",""],["高石市","/machi/osaka-62","この街の家と土地の値段",""],["貝塚市","/machi/osaka-66","この街の家と土地の値段",""]],"lh":"出てくる街のくわしいページ","lnote":""},{"t":"奈良の近鉄駅　3位学園前と4位生駒、差はたった54人","p":"奈良","k":"eki","d":"11/4","body":"1位は近鉄奈良 61,593人です！\n\n 1位 近鉄奈良（奈良市）61,593人\n 2位 大和西大寺（奈良市）45,137人\n 3位 学園前（奈良市）43,070人\n 4位 生駒（生駒市）43,016人\n 5位 大和八木（橿原市）34,056人\n\n上位3つは、すべて奈良市の駅。\n奈良市の外でいちばんは、生駒駅です。\n学園前との差は、1日でたった54人。\n\n1位と2位の差は16,456人。\n近鉄奈良駅が、ひとつ抜けています。\n大阪線の大和八木は5位に入りました。\n9位の五位堂まで、どの駅も2万人を超えています。\n1日の乗り降りの数は、駅を使う人の多さを知る目安のひとつです。\n\n 近鉄の駅だけの数字です（JRは入っていません）","u":"https://www.kintetsu.co.jp/tetsudo/2604_ekibetsujyokou.pdf","ub":"出どころの公式ページ","nomap":1,"id":"2026-11-04-9907","links":[["生駒市","/machi/nara-01","この街の家と土地の値段",""],["奈良市","/machi/nara-02","この街の家と土地の値段",""],["橿原市","/machi/nara-06","この街の家と土地の値段",""]],"lh":"出てくる街のくわしいページ","lnote":""},{"t":"京都市11区　住宅地の上がり幅1位は東山区+6.3%","p":"京都","k":"ie","d":"11/3","body":"京都市の家の土地（住宅地）、11区すべてで値上がりしていました！\nきのうの商業地（1位は南区）の続きです。\n\n 1位 東山区 +6.3%\n　・去年は+6.5%で2位\n 2位 下京区 +6.1%\n　・去年は+7.0%で1位\n 3位 南区 +5.9%\n\n 4位 上京区 +5.5%\n 5位 中京区 +4.4%\n\n京都市の住宅地は、平均で+2.8%。\n\n 植物園のある左京区は +2.2%\n　・去年と同じ上がり幅\n　・きょう11/3は府民交流フェスタ\n　・植物園の入園は無料（温室も）\n\n商業地では南区が1位、住宅地では東山区。\nお店の土地なら南区、家の土地なら東山区。上がっている場所が違うんです。\nほかの区の数字は、出典のPDFの住宅地の欄にあります。\n\n 区の平均の目安。家ごとの価格は物件により異なります","u":"https://www.pref.kyoto.jp/youchi/documents/r8chika-shikucyosonbetsu-taizennenhikaku.pdf","ub":"出どころの公式ページ","nomap":1,"id":"2026-11-03-8490","links":[],"lh":"出てくる街のくわしいページ","lnote":""},{"t":"南河内に実家があるなら　住宅地1位は大阪狭山市+1.1%","p":"大阪","k":"ie","d":"11/3","body":"南河内の1位は、2年続けて+1.1%でした！\n\n 令和8年地価公示・住宅地（1/1時点）\n 上位3つ\n　・1位 大阪狭山市 +1.1%\n　・2位 藤井寺市 +0.7%\n　・3位 富田林市 +0.6%\n\n 4位から\n　・松原市・河内長野市 +0.1%\n　・羽曳野市 −0.1%・太子町 −0.2%\n　・河南町 −0.9%・千早赤阪村 −2.6%\n\n 南河内地域の平均は +0.3%、府の平均は +2.8%\n\n大阪狭山市は、1年前の公示でも+1.1%でした。\n藤井寺市は+0.6%から+0.7%へ。\n同じ南河内でも、町によって動きの向きが違います。\n同じ市でも、家ごとに値段は違います。\n\n 市の平均の目安。家ごとの価格は物件により異なります","u":"https://www.pref.osaka.lg.jp/documents/7224/chikadayori102.pdf","ub":"出どころの公式ページ","nomap":1,"id":"2026-11-03-751c","links":[["大阪狭山市","/machi/osaka-55","この街の家と土地の値段",""],["河内長野市","/machi/osaka-57","この街の家と土地の値段",""],["千早赤阪村","/machi/osaka-60","この街の家と土地の値段",""],["藤井寺市","/machi/osaka-53","この街の家と土地の値段",""],["羽曳野市","/machi/osaka-54","この街の家と土地の値段",""],["富田林市","/machi/osaka-56","この街の家と土地の値段",""]],"lh":"出てくる街のくわしいページ","lnote":""},{"t":"滋賀・住宅地の基準地価　1位は草津市＋4.5％","p":"滋賀","k":"ie","d":"11/3","body":"県南部の3市が上位にそろいました！\n\n滋賀県が公表した令和8年の地価調査です。\n7月1日時点の住宅地を、市町ごとの平均変動率で並べました。\n\n 1位 草津市 ＋4.5％\n　・平均価格は1㎡あたり109,000円\n　・継続16地点のうち上昇15、下落0\n\n 2位 守山市 ＋3.6％\n　・平均価格は1㎡あたり99,700円\n　・前年の＋3.2％から伸びました\n\n 3位 野洲市 ＋3.1％\n　・平均価格は1㎡あたり76,100円\n　・前年は＋1.9％でした\n\n上位3つはJR琵琶湖線の沿線の市です。\n県全体の住宅地は＋0.6％で、前年の＋0.2％より上向きました。\n地点では大津市中央3丁目の＋8.8％が、住宅地でいちばんの上がり幅です。\n\n 市の平均です。土地ごとの値動きは別です","u":"https://www.pref.shiga.lg.jp/documents/2085/20260917160007.pdf","ub":"出どころの公式ページ","nomap":1,"id":"2026-11-03-3a9b","links":[["大津市","/machi/shiga-01","この街の家と土地の値段",""],["草津市","/machi/shiga-05","この街の家と土地の値段",""],["守山市","/machi/shiga-06","この街の家と土地の値段",""],["野洲市","/machi/shiga-09","この街の家と土地の値段",""]],"lh":"出てくる街のくわしいページ","lnote":""},{"t":"京都駅の南が東山を抜いた　商業地の上がり幅1位 南区+13.5%","p":"京都","k":"eki","d":"11/2","body":"京都市11区の商業地は全部プラス。去年1位の東山区は2位に！\n\n 1位 南区 +13.5%\n　・去年は+12.9%\n 2位 東山区 +12.7%\n　・去年は+14.0%で1位\n 3位 下京区 +9.6%\n\n 4位 中京区 +9.1%\n 5位 上京区 +7.7%\n\n京都市の商業地は、平均で+8.5%。\n11区すべてで上がっています。\n\n観光の東山より、京都駅の南側のほうが伸びた1年でした。\nただ、これはお店や事務所の土地の数字です。\n家の土地（住宅地）とは、別のものさしです。\n\n 南区の住宅地は +5.9%\n　・去年は+6.0%\n\n京都で実家や家を持っている方は、出典のPDFの住宅地の欄で、ご自分の区の数字を見てみてください。\n\n 7/1時点・区ごとの平均の変動率","u":"https://www.pref.kyoto.jp/youchi/documents/r8chika-shikucyosonbetsu-taizennenhikaku.pdf","ub":"出どころの公式ページ","nomap":1,"id":"2026-11-02-ffcf","links":[],"lh":"出てくる街のくわしいページ","lnote":""},{"t":"北河内に実家があるなら　住宅地1位は守口市+5.4%","p":"関西","k":"ie","d":"11/2","body":"7市とも、この1年でプラスでした！\n\n 令和8年地価公示・住宅地（1/1時点）\n 上位3つ\n　・1位 守口市 +5.4%\n　・2位 寝屋川市 +2.6%\n　・3位 門真市 +2.4%\n\n 4位から\n　・枚方市 +1.9%・大東市 +1.7%\n　・四條畷市・交野市 +1.2%\n\n 大阪府の住宅地の平均は +2.8%\n\n北河内7市は、守口・寝屋川・門真・枚方・大東・四條畷・交野。\n守口市は、1年前の公示でも+5.4%でした。\n同じ北河内でも、1年の動きは4倍以上ちがいます。\n守口市は、府の平均+2.8%の約2倍です。\n実家の値段は、家ごとに違います。\nまずは、実家の市の数字から。\n\n 市の平均の目安。家ごとの価格は物件により異なります","u":"https://www.pref.osaka.lg.jp/documents/7224/chikadayori102.pdf","ub":"出どころの公式ページ","nomap":1,"id":"2026-11-02-1e88","links":[["寝屋川市","/machi/osaka-43","この街の家と土地の値段",""],["四條畷市","/machi/osaka-47","この街の家と土地の値段",""],["枚方市","/machi/osaka-42","この街の家と土地の値段",""],["門真市","/machi/osaka-44","この街の家と土地の値段",""],["守口市","/machi/osaka-45","この街の家と土地の値段",""],["交野市","/machi/osaka-46","この街の家と土地の値段",""]],"lh":"出てくる街のくわしいページ","lnote":""},{"t":"1位 芦屋市+4.0%　阪神間8市町の住宅地","p":"関西","k":"ie","d":"11/1","body":"実家の市、この1年で何%動いた？\n\n 令和8年地価公示・住宅地（1/1時点）\n 上位3つ\n　・1位 芦屋市 +4.0%\n　・2位 西宮市 +3.8%\n　・3位 伊丹市 +3.7%\n\n 1年前の公示では\n　・1位 芦屋市 +3.6%\n　・2位 西宮市 +3.3%\n　・3位 伊丹市 +2.8%\n\n 地域の平均\n　・阪神南（尼崎・西宮・芦屋）+3.5%\n　・阪神北（伊丹など5市町）+2.6%\n\n8市町は、どこもプラス。\n芦屋市は1年前の公示でも1位でした。\nただ、1位と8位の差は3.5ポイントあります。\n同じ阪神間でも、市によって1年の動きはこれだけ違うんです！\n市の平均と、うちの家の値段は別の話。\n実家の市が何位か、次の投稿で探してみてください。\nうさぎちゃんも、表を並べてみて少しびっくりしました。\n\n 市の平均の目安です。家ごとの価格は物件により異なります","u":"https://web.pref.hyogo.lg.jp/ks21/documents/r8chikakojikakaku.pdf","ub":"出どころの公式ページ","nomap":1,"id":"2026-11-01-5a74","links":[["西宮市","/machi/hyogo-11","この街の家と土地の値段",""],["芦屋市","/machi/hyogo-12","この街の家と土地の値段",""],["伊丹市","/machi/hyogo-13","この街の家と土地の値段",""]],"lh":"出てくる街のくわしいページ","lnote":""},{"t":"高槻駅 1日59,490人　大阪市の外でJR乗車1位","p":"大阪","k":"eki","d":"11/1","body":"高槻駅は、姫路駅や神戸駅より1日に乗る人が多いんです！\n\n 2025年度・1日平均の乗車人員\n　・降りる人は含みません\n\n 1位 高槻駅（高槻市）59,490人\n 2位 茨木駅（茨木市）45,232人\n 3位 住道駅（大東市）27,831人\n\n 4〜7位\n　・吹
