<p class="lead" id="lead">3つえらぶだけで、次にやることが分かります。<small>無料・約30秒・お名前は要りません。関西のお家が対象です。</small></p>
<div class="pg" id="pg" aria-hidden="true"><i></i><i></i><i></i></div>

<section class="q on" id="q1" aria-live="polite">
<h2 tabindex="-1">お家は、どの街にありますか</h2>

<div class="pf" id="pf"></div>

</section>

<section class="q" id="q2">
<h2 tabindex="-1">いま、だれが住んでいますか</h2>
<p class="hint" id="h2"></p>
<button class="op" data-v="A">空き家・相続した<small>だれも住んでいない（名義変更がまだの家も）</small></button>
<button class="op" data-v="D">空き家・名義は親のまま<small>親は施設や別の家にいる</small></button>
<button class="op" data-v="C">親が住んでいる<small>これからのために考えておきたい</small></button>
<button class="op" data-v="B">自分や家族が住んでいる<small>親から相続した家に</small></button>
<button class="bk" data-b="1">← 街をえらび直す</button>
</section>

<section class="q" id="q3">
<h2 tabindex="-1">その家を、どうしたいですか</h2>
<p class="hint">いまの気持ちに近いものをえらんでください。あとで変えられます。</p>
<button class="op" data-v="1">早めに手放したい<small>1年くらいのうちに</small></button>
<button class="op" data-v="2">まだ迷っている<small>売るか残すか決めていない</small></button>
<button class="op" data-v="3">残しておきたい<small>思い出がある・いつか使うかもしれない</small></button>
<button class="bk" data-b="2">← ひとつ戻る</button>
</section>
