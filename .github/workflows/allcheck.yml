name: allcheck（月と燈の全ページを毎朝スマホの幅で確かめる）
# 11/1 オーナー「毎日不安で寝れない…HPのミスをずっと確認できてない」→ 9:20 の朝の点検の前に、全ページを開いて撮る。
# 結果は allcheck ブランチ（その日の分だけ）に report.md と shots/。朝の点検で月が見て、直してから報告する。
on:
  schedule:
    - cron: "35 23 * * *"   # 8:35
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: allcheck
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: ブラウザを入れる
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: 全ページを開いて確かめる
        run: NODE_PATH=/tmp/pw/node_modules node tools/allcheck/check.js /tmp/out
      - name: allcheck ブランチに置く（毎回その日の分だけ）
        run: |
          cd /tmp/out
          git init -q -b allcheck
          git config user.name "allcheck"
          git config user.email "allcheck@users.noreply.github.com"
          git add -A
          git commit -q -m "全ページ点検 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" allcheck
