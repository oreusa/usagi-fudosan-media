name: ai-i2v
# 写真から動画を作るAI の試し（claude/** で tools/outing_reel/ai-art/i2v_*.py を押した時）。結果は shots/ai-i2v/
on:
  push:
    branches: ['claude/**']
    paths: ['tools/outing_reel/ai-art/i2v_*.py', 'tools/outing_reel/ai-art/i2v_job.txt']
permissions:
  contents: write
jobs:
  i2v:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q gradio_client transformers torch --extra-index-url https://download.pytorch.org/whl/cpu pillow
      - env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -f tools/outing_reel/ai-art/i2v_job.txt ] && git diff --name-only HEAD~1 HEAD | grep -q i2v_job; then while read -r L; do [ -n "$L" ] && python3 tools/outing_reel/ai-art/i2v_depth.py $L || true; done < tools/outing_reel/ai-art/i2v_job.txt; elif git diff --name-only HEAD~1 HEAD | grep -q i2v_depth; then python3 tools/outing_reel/ai-art/i2v_depth.py shots/ai-depth || true; else python3 tools/outing_reel/ai-art/i2v_probe.py shots/ai-i2v shots/ai-art/jingoji-img/b-steps-21.webp || true; fi
      - run: |
          git config user.name "art bot"; git config user.email "actions@users.noreply.github.com"
          git add shots/ai-i2v shots/ai-depth* 2>/dev/null; git diff --cached --quiet || git commit -m "[CF-Pages-Skip] ai-i2v: 試し"
          for i in 1 2 3; do git pull --rebase -q origin ${GITHUB_REF_NAME} && git push origin HEAD:${GITHUB_REF_NAME} && break; sleep 5; done
