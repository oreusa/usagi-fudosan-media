name: townnotes-geo
# TOWN NOTES（仮）: おでかけリストのカードの場所を緯度・経度にして links/townnotes/geo.json に保存する。
on:
  push:
    branches: [claude/project-thread-fofi9q]
    paths: [tools/townnotes/geocode.py, .github/workflows/townnotes-geo.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  geo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/townnotes/geocode.py
      - run: |
          git config user.name "townnotes bot"
          git config user.email "actions@users.noreply.github.com"
          git add links/townnotes/geo.json
          git diff --cached --quiet || (git commit -m "townnotes: geo.json" && git push)
