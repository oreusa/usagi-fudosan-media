name: ig-post-reel
# インスタにリールを直接投稿する（曲つき）。
# 入力の spec は repo 内の JSON: {"video_url","caption","audio_id","audio_volume"(1-100, 任意)}
# 結果: ig/posts/<日時>.json
# 夜（18時台）は ig/reels/<今日>-pm.json があれば出す（2本目、任意）
# 朝（8時台）に ig/reels/<今日>.json があれば、media/reels/<今日>.mp4 を曲つきで投稿する（10/28〜 インスタのリールはこれだけ）
on:
  schedule:
    # 11/11 作り替え：GitHub の定時はこのリポジトリで5〜8時間おくれる日がある（11/11 朝の分は 10:22、夕方の分は 19:12 まで出なかった）。
    # 定時の時刻をあてにせず、毎時1回動かして「次に出す時刻（朝 08:00・夜 18:00）まで中で待ってから出す」形にした。
    # 待つのは最大5時間40分。出していれば何もしない。同時に待つのは1本だけ（下の concurrency）。
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      spec:
        description: "投稿内容のJSONファイル（repo内のパス。空なら今日の ig/reels）"
        required: false
      force:
        description: "記録があっても出す（出し直しはオーナーの許可を取ってから）"
        required: false
        default: "false"
permissions:
  contents: write
concurrency:
  group: ig-post-reel-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    env:
      GV: "v23.0"
    steps:
      - uses: actions/checkout@v4
      - name: post reel
        env:
          APP_SECRET: ${{ secrets.META_APP_SECRET }}
          SPEC: ${{ github.event.inputs.spec }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -eu
          mkdir -p ig/posts
          if [ -z "${SPEC:-}" ]; then
            # 次に出す物と、待つ秒数を決める（朝 08:00 ／ 夜 18:00。過ぎていても朝は15時前・夜は22時前なら今すぐ出す）
            OUT=$(TZ=Asia/Tokyo python3 - <<'PY'
          import datetime as dt, glob, os
          now = dt.datetime.fromisoformat(os.environ["NOW"]) if os.environ.get("NOW") else dt.datetime.now()
          D = now.date().isoformat()
          done = set()
          for f in glob.glob("ig/posts/*.json"):
              x = open(f, encoding="utf-8").read()
              if "permalink" in x:
                  done |= {s for s in (f"ig/reels/{D}.json", f"ig/reels/{D}-pm.json") if f'"{s}"' in x}
          for spec, hh, end in ((f"ig/reels/{D}.json", 8, 15), (f"ig/reels/{D}-pm.json", 18, 22)):
              t = now.replace(hour=hh, minute=0, second=0, microsecond=0)
              wait = int((t - now).total_seconds())
              if spec in done or not os.path.exists(spec) or now.hour >= end or wait > 20400:
                  continue
              print(spec, max(wait, 0)); break
          PY
            )
            [ -n "$OUT" ] || { echo "いま出す物・待つ物は無い（出し終わり／台本なし／5時間40分より先）"; exit 0; }
            SPEC=${OUT% *}; WAIT=${OUT#* }
            posted() { grep -lq "\"$SPEC\"" ig/posts/*.json 2>/dev/null && grep -l "\"$SPEC\"" ig/posts/*.json | xargs grep -q permalink; }
            if posted; then echo "already posted"; exit 0; fi
            if [ "$WAIT" -gt 0 ]; then
              echo "$SPEC を出す時刻まで ${WAIT} 秒待つ"; sleep "$WAIT"
              git pull -q --rebase || true   # 待っている間に直された台本・ほかの回の記録を取り込む
              if posted; then echo "already posted"; exit 0; fi
            fi
            [ -f "$SPEC" ] || { echo "no reel: $SPEC"; exit 0; }
          fi
          # 11/4 手で動かした時も、記録があれば出さない（9:20 に朝の分を2回出した。7:57 の記録が push に失敗して残っていなかった）
          if [ "${FORCE:-}" != "true" ] && grep -lq "\"$SPEC\"" ig/posts/*.json 2>/dev/null && grep -l "\"$SPEC\"" ig/posts/*.json | xargs grep -q permalink; then echo "already posted"; exit 0; fi
          export SPEC
          PT=$(openssl enc -d -aes-256-cbc -pbkdf2 -a -pass env:APP_SECRET -in ig/page_token.enc)
          export PT
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.parse
          GV = os.environ["GV"]; PT = os.environ["PT"]
          ig = json.load(open("ig/setup.json"))["ig_user_id"]
          spec = json.load(open(os.environ["SPEC"]))
          # 決まり（10/28 オーナー）：曲は金木犀とオレンジの空、キャプションの1行目は必ずシリーズ名
          spec.setdefault("audio_id", "1638443601035185")
          T = "関西の不動産屋が、街の調査で見つけたおでかけリスト"
          OLD = "不動産屋が、街の調査でみつけたおでかけスポット"
          c = spec.get("caption", "")
          if c.startswith(OLD): spec["caption"] = c = c[len(OLD):].lstrip("\n")
          if spec.get("date") and not c.startswith(T):
              spec["caption"] = T + "\n" + spec.get("caption", "")
          if not spec.get("video_url") and spec.get("date"):
              spec["video_url"] = f"https://oreusa.github.io/usagi-fudosan-media/media/reels/{spec['date']}.mp4"
          def call(method, path, **q):
              q["access_token"] = PT
              data = urllib.parse.urlencode(q).encode()
              url = f"https://graph.facebook.com/{GV}/{path}"
              req = urllib.request.Request(url + ("?" + data.decode() if method == "GET" else ""),
                                           data=None if method == "GET" else data, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=60) as r: return json.load(r)
              except urllib.error.HTTPError as e:
                  return {"error": json.loads(e.read().decode() or "{}").get("error", {"code": e.code})}
          log = {"spec": os.environ["SPEC"], "at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())}
          # 11/4 記録が残っていなくても、インスタの最近の5本に同じ説明文があれば出さない（2回出しを防ぐ）
          if os.environ.get("FORCE") != "true":
              rec = call("GET", f"{ig}/media", fields="caption,permalink,timestamp", limit="5").get("data", [])
              same = [m for m in rec if (m.get("caption") or "").strip() == (spec.get("caption") or "").strip()]
              if same:
                  print("already on instagram:", same[0].get("permalink")); raise SystemExit(0)
          q = dict(media_type="REELS", video_url=spec["video_url"], caption=spec.get("caption", ""), share_to_feed="true")
          if spec.get("audio_id"):
              ac = {"audio_id": spec["audio_id"]}
              if spec.get("audio_volume"): ac["audio_volume"] = int(spec["audio_volume"])
              if spec.get("video_volume"): ac["video_volume"] = int(spec["video_volume"])
              q["audio_configuration"] = json.dumps(ac)
          c = call("POST", f"{ig}/media", **q); log["container"] = c
          cid = c.get("id")
          if cid:
              for i in range(40):
                  s = call("GET", cid, fields="status_code,status"); log["status"] = s
                  if s.get("status_code") in ("FINISHED", "ERROR", "EXPIRED"): break
                  time.sleep(10)
              if log["status"].get("status_code") == "FINISHED":
                  p = call("POST", f"{ig}/media_publish", creation_id=cid); log["publish"] = p
                  if p.get("id"):
                      log["permalink"] = call("GET", p["id"], fields="permalink").get("permalink")
          # リールが出たら、spec の "stories"（動画URLの並び）をストーリーとして順に出す（リンクスタンプは付けられない）
          if log.get("permalink") and spec.get("stories"):
              log["stories"] = []
              for su in spec["stories"]:
                  sc = call("POST", f"{ig}/media", media_type="STORIES", video_url=su); st = {"url": su, "container": sc}
                  if sc.get("id"):
                      for i in range(40):
                          ss = call("GET", sc["id"], fields="status_code"); st["status"] = ss
                          if ss.get("status_code") in ("FINISHED", "ERROR", "EXPIRED"): break
                          time.sleep(10)
                      if st["status"].get("status_code") == "FINISHED":
                          st["publish"] = call("POST", f"{ig}/media_publish", creation_id=sc["id"])
                  log["stories"].append(st)
          name = time.strftime("%Y%m%d-%H%M%S", time.gmtime())
          json.dump(log, open(f"ig/posts/{name}.json", "w"), ensure_ascii=False, indent=1)
          print(json.dumps({k: log.get(k) for k in ("permalink",)}, ensure_ascii=False))
          PY
      - name: reel stats
        # 11/11 リールの数字を毎日とる（それまで再生の数を測っていなかった）。6時間に1回だけ。しっぱいしても投稿は止めない。
        if: always()
        continue-on-error: true
        env:
          APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: |
          PT=$(openssl enc -d -aes-256-cbc -pbkdf2 -a -pass env:APP_SECRET -in ig/page_token.enc); export PT
          python3 tools/reel_stats.py
      - name: commit
        run: |
          git config user.name "ig-post bot"
          git config user.email "actions@users.noreply.github.com"
          # 出し終わって14日たった動画は消す（容量を増やしすぎない）
          OLD=$(TZ=Asia/Tokyo date -d '14 days ago' +%F)
          for f in media/reels/*.mp4; do b=$(basename "$f"); [ "${b:0:10}" \< "$OLD" ] && git rm -q "$f" || true; done
          git add ig/posts stats/reels.json stats/reels.md 2>/dev/null || git add ig/posts
          git diff --cached --quiet || git commit -m "[CF-Pages-Skip] ig: リール投稿の記録"
          # 11/4 ほかの係と同時に push すると断られて記録が残らなかった → 5回までやり直す
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep $((i*5)); done
