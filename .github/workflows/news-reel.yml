name: おでかけニュースの写真リール（見本）
# 11/18 月の見本。tools/outing_reel/news.py で ig/reels-mihon/<name>.json から動画を作り media/reels/mihon/<name>.mp4 に置く。
# ig/reels-mihon は自動投稿されない（投稿は ig/reels だけ）。オーナーのOKまでは見本のまま。
on:
  workflow_dispatch:
    inputs:
      name:
        description: "ig/reels-mihon の spec の名前（例 2026-11-19-news）"
        required: true
permissions:
  contents: write
concurrency: { group: news-reel, cancel-in-progress: false }
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      vv:
        image: voicevox/voicevox_engine:cpu-latest
        ports:
          - 50021:50021
    steps:
      - uses: actions/checkout@v4
      - name: 道具
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install -q pillow
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y -q >/dev/null && npm i -q playwright@1.47.2 && npx playwright install chromium
      - name: 動画を作る
        env:
          NODE_PATH: /tmp/pw/node_modules
          VOICE_URL: http://127.0.0.1:50021
          N: ${{ inputs.name }}
        run: |
          case "$N" in *[!A-Za-z0-9_-]*) echo "名前が変"; exit 1;; esac
          mkdir -p media/reels/mihon
          WORK=/tmp/news STILLS="1,5,9.5,14,18,24" python3 tools/outing_reel/news.py "ig/reels-mihon/$N.json" "media/reels/mihon/$N.mp4"
          mkdir -p media/reels/mihon/$N-still && cp /tmp/news/c-*.jpg media/reels/mihon/$N-still/ 2>/dev/null || true
      - name: 保存
        run: |
          git config user.name "reel bot"
          git config user.email "actions@users.noreply.github.com"
          git add media/reels/mihon
          git diff --cached --quiet && exit 0
          git commit -q -m "おでかけニュースの写真リール（見本）"
          for i in 1 2 3 4 5; do git pull --rebase --autostash -q origin main && git push -q origin HEAD:main && exit 0; git rebase --abort 2>/dev/null; sleep $((i*5)); done
          exit 1
