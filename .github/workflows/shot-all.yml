name: shot-all
# 公開中の全種類のページ（関西・関東）を1回でまとめて撮って点検する。結果は shots/all/<name>/ に残す（手で動かす時だけ）
on:
  workflow_dispatch:
    inputs:
      name: {description: "保存するフォルダ名", required: true, default: "all"}
      tech: {description: "見本の合図（空＝ふつうのお客さんの見た目／2＝新しい動きとデザイン）", required: false, default: ""}
permissions:
  contents: write
concurrency:
  group: shot-all
  cancel-in-progress: false
jobs:
  shot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - env:
          SHOT_NAME: ${{ inputs.name }}
          SHOT_TECH: ${{ inputs.tech }}
        run: |
          case "$SHOT_NAME" in *[!A-Za-z0-9_-]*|"") echo "bad name"; exit 1;; esac
          case "$SHOT_TECH" in ""|1|2) ;; *) echo "bad tech"; exit 1;; esac
          rm -rf "shots/all/$SHOT_NAME"
          node tools/shot_all.js "shots/all/$SHOT_NAME" "$SHOT_TECH"
      - env:
          SHOT_NAME: ${{ inputs.name }}
        run: |
          git config user.name "page-shot bot"
          git config user.email "actions@users.noreply.github.com"
          git add shots/all
          git diff --cached --quiet || (git commit -q -m "[CF-Pages-Skip] shot-all: $SHOT_NAME" && git pull --rebase -q && git push -q)
