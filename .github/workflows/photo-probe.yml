name: photo-probe
# 11/18 場所の自由に使える写真（ウィキメディア・コモンズ）を集めて、作業用の枝に置く（見本づくり用）
on:
  workflow_dispatch:
    inputs:
      words: {description: "探す言葉（| で区切る）", required: true, default: "Eikan-do autumn|Kiyomizu-dera|Himeji Castle|Arashiyama|Osaka Castle|Nara Park deer|Kobe Harborland|Shirarahama|Lake Biwa"}
      w: {description: "写真の幅（@ファイルの時）", required: false, default: "480"}
      tool: {description: "cover＝1枚 / best＝行きたくなる写真の候補3枚", required: false, default: "cover"}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [[ "${{ inputs.words }}" == @* ]]; then
            f="${{ inputs.words }}"; f="${f#@}"; b=$(basename "$f" .tsv); if [ "${{ inputs.tool }}" = best ]; then b="$b-best"; PW="${{ inputs.w }}" python3 tools/photo/best.py "$f" "tools/photo/probe/$b"; else PW="${{ inputs.w }}" python3 tools/photo/cover.py "$f" "tools/photo/probe/$b"; fi
          else
            IFS='|' read -ra W <<< "${{ inputs.words }}"
            python3 tools/photo/commons.py tools/photo/probe "${W[@]}"
          fi
      - run: |
          git config user.name "photo-probe"; git config user.email "actions@users.noreply.github.com"
          mv tools/photo/probe /tmp/probe
          if git fetch -q origin photo-probe; then git checkout -qB photo-probe FETCH_HEAD; else git checkout -q --orphan photo-probe && git rm -rfq .; fi
          mkdir -p tools/photo/probe && cp -r /tmp/probe/* tools/photo/probe/
          git add -f tools/photo/probe && git commit -qm "photo-probe" && for i in 1 2 3 4; do git pull -q --rebase origin photo-probe 2>/dev/null || true; git push origin photo-probe && break; sleep 7; done
