name: townnotes-live
# 公開中の試作ページが新しい版になっているかを確かめる（作業環境からはサイトに届かないため）
on:
  push:
    branches: [claude/project-thread-fofi9q]
    paths: [.github/workflows/townnotes-live.yml]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U=https://usagi-odekake.usagi-fudosan.workers.dev
          curl -sSI $U/townnotes/ | sed -n '1,20p'
          curl -sS $U/townnotes/ -o page.html; grep -o 'map.js[^"]*' page.html
          J=$(grep -o '/townnotes/map.js[^"]*' page.html | head -1)
          curl -sSI "$U$J" | sed -n '1,20p'
          curl -sS "$U$J" -o map.js; wc -c map.js
          echo "omk count: $(grep -c 'omk' map.js)"; echo "fresh: $(grep -c 'function fresh' map.js)"
          curl -sS "$U/townnotes/map.js" | grep -c 'function fresh' || true
