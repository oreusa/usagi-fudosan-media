name: townnotes-live
# 公開中の試作ページが新しい版になっているかを確かめる（作業環境からはサイトに届かないため）
on:
  push:
    branches: [claude/project-thread-fofi9q]
    paths: [.github/workflows/townnotes-live.yml]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U=https://usagi-odekake.usagi-fudosan.workers.dev
          echo "--- 本番のリスト"
          curl -sS $U/ -o top.html; grep -o '/townnotes/map.js[^"]*' top.html || echo "地図の読み込みなし"
          J=$(grep -o '/townnotes/map.js[^"]*' top.html | head -1)
          [ -n "$J" ] && curl -sS "$U$J" -o map.js && wc -c map.js && echo "mbUpd: $(grep -c 'function mbUpd' map.js)  cnt1: $(grep -c 'function cnt1' map.js)"
          echo "--- 試作ページ"
          curl -sS $U/townnotes/ | grep -o 'src="map.js[^"]*"' || true
          echo "--- cloudflare status"
          curl -sS https://www.cloudflarestatus.com/api/v2/incidents/unresolved.json | python3 -c "import json,sys;d=json.load(sys.stdin);[print(i['name'],'|',i['status'],'|',i['created_at'],'|',[c['name'] for c in i.get('components',[])]) for i in d['incidents']]" || true
          echo "--- github pages (予備)"
          G=https://oreusa.github.io/usagi-fudosan-media/links/townnotes/
          curl -sS -o gp.html -w '%{http_code}\n' $G; grep -o 'townnotes/map.js[^"]*' gp.html || true
          curl -sS -o /dev/null -w 'map.js %{http_code}\n' https://oreusa.github.io/usagi-fudosan-media/links/townnotes/map.js
