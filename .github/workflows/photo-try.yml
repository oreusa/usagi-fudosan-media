name: photo-try
# 試し（本番に入れない）：写真つきおでかけリストの見本を作って撮る。このブランチに押したときだけ動く
on:
  push:
    branches: [claude/project-thread-90bnes]
    paths: [tools/photo_try/**, .github/workflows/photo-try.yml]
permissions:
  contents: write
jobs:
  try:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: git fetch -q origin main && git restore --source origin/main --worktree links tools/shot_page.js && mkdir -p shots && python3 tools/photo_try/make.py
      - run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: |
          cd links && (python3 -m http.server 8080 >/dev/null 2>&1 &) && sleep 2 && cd ..
          mkdir -p shots/page
          node tools/shot_page.js "http://localhost:8080/preview-photo.html" "shots/page/photo-try" ""
          node tools/shot_page.js "http://localhost:8080/index.html" "shots/page/photo-now" ""
      - run: |
          git config user.name "photo-try bot"
          git config user.email "actions@users.noreply.github.com"
          rm -f shots/page/*/page.html
          git add shots links/preview-photo.html
          git commit -m "[CF-Pages-Skip] photo-try: 見本と写真" && git push
