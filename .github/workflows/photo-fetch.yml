name: photo-fetch
# 写真を取りに行く（リールの見本用。作業環境から届かない所の画像を shots/photo/<name>/ に置く）。手で動かす。
on:
  workflow_dispatch:
    inputs:
      list: {description: "画像のURLを1行ずつ書いたファイル（repo内のパス）", required: true}
      name: {description: "置き場の名前", required: true}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          LIST: ${{ inputs.list }}
          NAME: ${{ inputs.name }}
        run: |
          mkdir -p "shots/photo/$NAME"; n=0
          while read -r u; do [ -z "$u" ] && continue; n=$((n+1)); curl -sSL -m 60 -A "reel-sample-fetch/1.0" -o "shots/photo/$NAME/$n.jpg" "$u" || true; sleep 1; done < "$LIST"
          ls -la "shots/photo/$NAME"
          git config user.name "photo bot"; git config user.email "actions@users.noreply.github.com"
          git add shots/photo
          git diff --cached --quiet || git commit -m "[CF-Pages-Skip] photo-fetch: $NAME"
          for i in 1 2 3 4 5; do git pull --rebase --autostash -q && git push && break; sleep $((i*5)); done
