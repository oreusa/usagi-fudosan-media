name: link-stats
# 毎朝 08:30 JST に、おでかけリストのクリック数（/stats）を stats/link.json に保存する。
# link-30.json（30日分）は日曜のおでかけリスト基準の学習で使う。
# 朝の報告がこのファイルを読んで管制室に書く（作業環境からは workers.dev に直接つなげないため）。
on:
  schedule:
    - cron: "30 23 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch stats
        run: |
          mkdir -p stats
          curl -fsS "https://usagi-odekake.usagi-fudosan.workers.dev/stats?days=3" -o stats/link.json
          curl -fsS "https://usagi-odekake.usagi-fudosan.workers.dev/stats?days=30" -o stats/link-30.json
          python3 -c "import json;d=json.load(open('stats/link.json'));print(d['days'],len(d['by_day']))"
      - name: funnel (反響までの道)
        run: |
          python3 tools/funnel/build.py "$(TZ=Asia/Tokyo date +%F)" || true
          python3 tools/seichou/build.py "$(TZ=Asia/Tokyo date +%F)" || true
      - name: rebuild illumination pages
        # 10/31 毎朝作り直して「更新日」と終わった物・よくある質問を新しくする（検索で新しいページと見てもらうため）
        run: |
          # 11/12 1つの作る機械が止まっても、ほかと数字の保存は止めない（/kaitai の点検で止まり、数字が1日入らなかった）。
          # 止まった物の名前は stats/build-fail.txt に残し、学習の台帳（gakushu.py）が朝の指令のいちばん上に出す
          D="$(TZ=Asia/Tokyo date +%F)"; : > stats/build-fail.txt
          for b in illumi/build.py hatsumode/build.py ranking/build.py kaitai/build.py kaitai/city.py kaiten/build.py; do
            python3 tools/$b "$D" || echo "$D tools/$b" >> stats/build-fail.txt
          done
          # 11/27 関西のふるさと納税（/furusato）。品と値段は燈が楽天APIで取り直す akari data/furusato.json をそのまま使う
          FZ="$(mktemp)"; curl -fsSL --max-time 20 https://raw.githubusercontent.com/oreusa/akari-auto/main/data/furusato.json -o "$FZ" \
            && python3 tools/furusato/build.py "$D" "$FZ" || echo "$D tools/furusato/build.py" >> stats/build-fail.txt
          # 11/17 関東の /kaitai（to_life.py・city_life.py）も毎日ためしに作る。関東の住所の点検で 11/14〜11/17 止まっていたのに誰も気づかなかった。
          # 本物は月の朝の回が akari へ出す。ここは止まったら stats/build-fail.txt に出すだけ（学習の台帳が朝いちばんに出す）
          AKT="$(mktemp -d)"; mkdir -p "$AKT/site"; curl -fsSL --max-time 20 https://raw.githubusercontent.com/oreusa/akari-auto/main/site/moushikomi.html -o "$AKT/site/moushikomi.html" \
            && python3 tools/kaitai/to_life.py "$AKT" >/dev/null && python3 tools/kaitai/city_life.py "$AKT" >/dev/null || echo "$D tools/kaitai/to_life.py（関東の /kaitai）" >> stats/build-fail.txt
      - name: event info for search on the list
        # 11/2 おでかけリストのカードから Event の構造化データを作り直す（終わった物は外す）
        run: python3 tools/odekake_ld.py "$(TZ=Asia/Tokyo date +%F)"
      - name: list pages per prefecture (for search)
        # 11/4 府県ごとのページ（/odekake-osaka など6つ）をリストから作り直す。検索の「大阪 イベント」などに合わせる
        run: |
          python3 tools/odekake_pref.py "$(TZ=Asia/Tokyo date +%F)"
          # 11/21 1件ページの「近くの宿」は街なかも（燈の kansai-yado-all.json）。取れない日は前のまま
          curl -fsS "https://kanto.townnote.app/kansai-yado-all.json" -o links/kansai-yado-all.json || true
          python3 tools/odekake_spot.py "$(TZ=Asia/Tokyo date +%F)"
          # 11/4 1件ページを LINE・X に貼った時の画像（地図つき）。作れない日は前の画像のまま
          pip install -q cairosvg pillow && python3 tools/spot_og.py || echo "og images skipped"
      - name: near hotels (from 燈's site, for the 近くの宿 buttons)
        # 10/31 宿の一覧を月のページと同じ場所に置く（見るたびに燈のサイトから読むと遅いため）。取れない日は前のまま
        run: curl -fsS "https://kanto.townnote.app/kansai-yado.json" -o links/kansai-yado.json || true
      - name: rebuild 泊まりで行くおでかけ
        # 10/31 宿とカードの新しい一覧で毎朝作り直す（終わったおでかけは消える）
        run: python3 tools/tomari/build.py "$(TZ=Asia/Tokyo date +%F)"
      - name: mihon (今のHPに足す写真・一言・時間の表)
        # 11/18 今のHPのクオリティアップ見本（?mihon=1 の人だけ）。毎朝 links/index.html のカードから表を作り直す。止まっても他は止めない
        run: |
          python3 tools/mihon/build.py || echo "$(TZ=Asia/Tokyo date +%F) tools/mihon/build.py" >> stats/build-fail.txt
          pip install -q pillow >/dev/null 2>&1 || true
          timeout 900 python3 tools/mihon/autophoto.py || echo "$(TZ=Asia/Tokyo date +%F) tools/mihon/autophoto.py" >> stats/build-fail.txt
          python3 tools/mihon/build.py || true
          python3 tools/hx/nightscore.py links/assets/ph || true
          # 11/19 激変版（?mihon=2）：写真が出る前のぼかし色（ThumbHash）。新しい写真の分だけ足す
          pip install -q thumbhash-python >/dev/null 2>&1 && python3 tools/hx/phh.py links/assets || true
      - name: new HP pages (新しい土台 /odekake・/fudosan-list・/okaimono)
        # 11/19 owner「入れ替える」：毎朝 links/index.html・相場・燈の値段の表から links/shin/*.html を作り直す。止まっても他は止めない
        run: python3 tools/shin/build.py || echo "$(TZ=Asia/Tokyo date +%F) tools/shin/build.py" >> stats/build-fail.txt
      - name: cover data (表紙の地図の数字)
        # 11/10 表紙 v3：府県ごとの開催中・地価の上がり幅・戸建の売れた平均を3KBの cover.json に（表紙は毎回リスト全体を読まない）
        run: pip install -q beautifulsoup4 && python3 tools/cover/make.py || true
      - name: HP page-type learning
        # 11/9 ページ型ごとの「外から来た数」この7日／前の7日 → 増やす型・直す型（朝の報告に1行）
        run: python3 tools/hp_learning.py || true
      - name: sitemap dates
        # 11/9 lastmod を「中身が変わった日」に（毎日すべて今日だと Google が日付を信じなくなる）
        run: python3 tools/sitemap_dates.py "$(TZ=Asia/Tokyo date +%F)" && cp links/sitemap.xml links/sitemap-all.xml && python3 tools/seo/sitemap_main.py links/sitemap.xml links/sitemap-main.xml
      - name: learning ledger (学習の台帳・きょうの指令)
        # 11/11 取り組み全部の答え合わせと、各回への指令を作る（月の朝・投稿・リールの回は動く前に stats/shirei.json を読む）
        run: |
          curl -fsSL --max-time 20 https://raw.githubusercontent.com/oreusa/akari-auto/main/notes/gpt-runs.md -o /tmp/gpt-runs.md || true
          curl -fsSL --max-time 20 https://raw.githubusercontent.com/oreusa/akari-auto/main/notes/sales-board.md -o /tmp/sales-board.md || true
          python3 tools/room/kazu.py "$(TZ=Asia/Tokyo date +%F)" || true
          python3 tools/allcheck/kimari.py "$(TZ=Asia/Tokyo date +%F)" || true
          GPT_RUNS=/tmp/gpt-runs.md SALES_BOARD=/tmp/sales-board.md python3 tools/seichou/gakushu.py "$(TZ=Asia/Tokyo date +%F)" || true
      - name: link check
        # 10/31 毎朝、リストとイルミのカードのリンクが開けるか・別の催しに同じURLが付いていないかを stats/linkcheck.md に（19:47 の点検が直す）
        run: python3 tools/linkcheck.py || true
      - name: fudosan watch
        # 11/16 不動産リストの新着さがし（国・府県・鉄道のお知らせから。足すのは月曜・木曜の 19:47 の回）
        run: python3 tools/fudosan_list/watch.py || true
      - name: commit
        run: |
          git config user.name "link-stats bot"
          git config user.email "actions@users.noreply.github.com"
          git add stats/build-fail.txt stats/link.json stats/link-30.json stats/funnel.md stats/funnel.json stats/seichou.md stats/seichou.json links/illumination*.html links/koyo*.html links/hatsumode.html links/ranking.html links/kaiten.html links/kaitai.html links/kaitai-*.html links/index.html links/shin links/odekake-*.html links/o links/assets/mihon.json links/assets/ph tools/new tools/photo/venues.json links/sitemap.xml links/sitemap-all.xml links/sitemap-main.xml stats/sitemap-dates.json stats/hp-learning.json links/kansai-yado.json links/tomari.html stats/linkcheck.md stats/fudosan-shinchaku.md stats/fudosan-watch.json links/assets/cover.json stats/room.json stats/room-fail.txt stats/gakushu.md stats/gakushu.json stats/kimari.json stats/shirei.json stats/manabi.json stats/yatta.json
          git diff --cached --quiet && exit 0
          git commit -q -m "stats + illumination rebuild: $(TZ=Asia/Tokyo date +%F)"
          # 11/12 ほかの保存と重なると push が断られ、その日の数字と台帳がまるごと消えていた → やり直す（ぶつかった所は、いま作った物を残す）
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -q -X theirs origin main && git push -q origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true; sleep $((i*7))
          done
          exit 1
