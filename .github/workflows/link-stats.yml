name: link-stats
# 毎朝 08:30 JST に、おでかけリストのクリック数（/stats）を stats/link.json に保存する。
# link-30.json（30日分）は日曜のおでかけリスト基準の学習で使う。
# 朝の報告がこのファイルを読んで管制室に書く（作業環境からは workers.dev に直接つなげないため）。
on:
  schedule:
    - cron: "30 23 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch stats
        run: |
          mkdir -p stats
          curl -fsS "https://usagi-odekake.usagi-fudosan.workers.dev/stats?days=3" -o stats/link.json
          curl -fsS "https://usagi-odekake.usagi-fudosan.workers.dev/stats?days=30" -o stats/link-30.json
          python3 -c "import json;d=json.load(open('stats/link.json'));print(d['days'],len(d['by_day']))"
      - name: rebuild illumination pages
        # 10/31 毎朝作り直して「更新日」と終わった物・よくある質問を新しくする（検索で新しいページと見てもらうため）
        run: python3 tools/illumi/build.py "$(TZ=Asia/Tokyo date +%F)"
      - name: near hotels (from 燈's site, for the 近くの宿 buttons)
        # 10/31 宿の一覧を月のページと同じ場所に置く（見るたびに燈のサイトから読むと遅いため）。取れない日は前のまま
        run: curl -fsS "https://usagi-life-notes.pages.dev/kansai-yado.json" -o links/proto/kansai-yado.json || true
      - name: commit
        run: |
          git config user.name "link-stats bot"
          git config user.email "actions@users.noreply.github.com"
          git add stats/link.json stats/link-30.json links/illumination*.html links/sitemap.xml links/proto/kansai-yado.json
          git diff --cached --quiet || (git commit -m "stats + illumination rebuild: $(TZ=Asia/Tokyo date +%F)" && git push)
