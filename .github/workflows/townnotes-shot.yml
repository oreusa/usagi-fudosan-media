name: townnotes-shot
# TOWN NOTES（仮）の地図ページを撮って shots/townnotes/ に保存する（作業環境からは地図タイルに届かないため）。
on:
  push:
    branches: [claude/project-thread-fofi9q]
    paths: [tools/townnotes/map.src.js, tools/townnotes/shot.js, links/townnotes/**, .github/workflows/townnotes-shot.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: |
          (cd links && python3 -m http.server 8765 >/dev/null 2>&1 &)
          sleep 1
          node tools/townnotes/shot.js
          cat shots/townnotes/log.txt
      - run: |
          git config user.name "townnotes bot"
          git config user.email "actions@users.noreply.github.com"
          git add shots/townnotes
          git diff --cached --quiet || (git commit -m "townnotes: shots" && git pull --rebase -q && git push)
