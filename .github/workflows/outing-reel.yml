name: outing-reel（関西のおでかけリールを声つきで作って置く）
# 11/11 オーナー「毎回変わる。月と燈にしっかり渡せる仕組みに」。
# 夜の回は ig/reels/<名前>.json（"voice" に声の台本4行、"video_url" に置き場）を main に入れるだけ。
# この機械が VOICEVOX で声を作り、tools/outing_reel/make.py で動画を作って media/reels/ に置く。
# 11/12〜 spec に "kata": "ehon" があれば、絵本を開く型（tools/outing_reel/ehon.py。声6行＋読みの答え合わせ voice_yomi）で作る。
# 作るのは「video_url のファイルがまだ無い spec」だけ。作り直す時は video_url のファイル名を新しくする（-v2 など）。
on:
  push:
    branches: [main]
    paths: ["ig/reels/*.json", "tools/outing_reel/ehon.py"]   # 11/13 道具を直したら、まだ出していない動画を作り直す（数字の向きを直す前の動画が、そのまま出た）
  workflow_dispatch:
    inputs:
      name:
        description: "作る spec の名前（例 2026-11-12-pm。空なら、まだ動画が無い分を全部）"
        required: false
permissions:
  contents: write
concurrency:
  group: outing-reel
  cancel-in-progress: false
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      vv:
        image: voicevox/voicevox_engine:cpu-latest
        ports:
          - 50021:50021
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 作る物を決める
        id: todo
        env:
          ONLY: ${{ github.event.inputs.name }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import glob, json, os, subprocess, datetime
          only = os.environ.get("ONLY", "").strip(); todo = []
          today = (datetime.datetime.utcnow() + datetime.timedelta(hours=9)).date().isoformat()
          posted = set()
          for f in glob.glob("ig/posts/*.json"):
              x = open(f, encoding="utf-8").read()
              if "permalink" in x:
                  try: posted.add(json.loads(x).get("spec", ""))
                  except Exception: pass
          for p in sorted(glob.glob("ig/reels/*.json")):
              n = os.path.basename(p)[:-5]
              if only and n != only: continue
              d = json.load(open(p))
              if not d.get("voice") or not d.get("video_url"): continue
              out = "media/reels/" + d["video_url"].rsplit("/", 1)[-1]
              if not os.path.exists(out): todo.append(n); continue
              # 11/13 まだ出していない絵本の型の動画が、道具（ehon.py）より古ければ作り直す。出した物には触らない
              if d.get("kata") == "ehon" and n[:10] >= today and f"ig/reels/{n}.json" not in posted:
                  ct = lambda f: int(subprocess.run(["git", "log", "-1", "--format=%ct", "--", f], capture_output=True, text=True).stdout.strip() or 0)
                  if ct(out) < ct("tools/outing_reel/ehon.py"): todo.append(n)
          print("todo=" + " ".join(todo))
          PY
      - name: 道具（ffmpeg・Chromium）
        if: steps.todo.outputs.todo != ''
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y -q >/dev/null && npm i -q playwright@1.47.2 && npx playwright install chromium
      - name: 動画を作る
        if: steps.todo.outputs.todo != ''
        env:
          NODE_PATH: /tmp/pw/node_modules
          VOICE_URL: http://127.0.0.1:50021
          TODO: ${{ steps.todo.outputs.todo }}
        run: |
          set -u
          fail=0
          for n in $TODO; do
            out=$(python3 -c "import json,sys;print('media/reels/'+json.load(open(f'ig/reels/{sys.argv[1]}.json'))['video_url'].rsplit('/',1)[-1])" "$n")
            kata=$(python3 -c "import json,sys;print(json.load(open(f'ig/reels/{sys.argv[1]}.json')).get('kata',''))" "$n")
            tool=tools/outing_reel/make.py; [ "$kata" = "ehon" ] && tool=tools/outing_reel/ehon.py   # 11/12〜 絵本を開く型（"kata": "ehon"）
            # 作れなかった時は、理由（声の読みの違い等）を stats/reel-fail/<名前>.txt に残す（記録を開かなくても分かるように）
            mkdir -p stats/reel-fail
            if WORK=/tmp/reel-$n python3 $tool "ig/reels/$n.json" "$out" 2>&1 | tee /tmp/reel-$n.log; [ "${PIPESTATUS[0]}" = 0 ]; then echo "できた $out"; rm -f "stats/reel-fail/$n.txt"; else echo "::error::$n の動画を作れない"; tail -n 40 /tmp/reel-$n.log > "stats/reel-fail/$n.txt"; fail=1; fi
          done
          exit $fail
      - name: 保存
        if: always() && steps.todo.outputs.todo != ''
        run: |
          git config user.name "reel bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A media/reels stats/reel-fail 2>/dev/null || git add media/reels
          git diff --cached --quiet && exit 0
          git commit -q -m "おでかけリールの動画を置いた"
          for i in 1 2 3 4 5; do git pull --rebase --autostash -q origin main && git push -q origin HEAD:main && exit 0; git rebase --abort 2>/dev/null; sleep $((i*5)); done
          exit 1
