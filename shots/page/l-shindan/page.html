var ST={
 touki:["相続登記を確かめる","2024年4月1日から、相続で家や土地を受け取ったと知った日から3年以内の相続登記が義務になりました。2024年3月より前の相続も対象で、期限は「2027年3月31日」か「受け取ったと知った日から3年」の、どちらか遅い方です。","https://www.moj.go.jp/MINJI/souzokutouki-gimuka/index.html","出典：法務省「相続登記の申請義務化」"],
 kataduke:["家財を片付ける","片付け・遺品整理の見積りを先に取ると、売る時期を決めやすくなります。見積りは作業の中身と追加料金を確かめてから頼みましょう。","https://www.kokusen.go.jp/mimamori/mj_mailmag/mj-shinsen525.html","出典：国民生活センター「遺品整理を頼むときは、事業者選びは慎重に」"],
 kanri:["手入れを続ける","手入れが足りず市から「管理不全空家」として勧告を受けると、土地の固定資産税の軽減（住宅用地特例）が外れます。草木・郵便物・雨もりを、定期的に見に行く人を決めましょう。","https://www.mlit.go.jp/jutakukentiku/house/content/001621960.pdf","出典：国土交通省「空家等対策の推進に関する特別措置法の一部を改正する法律」概要"],
 kaitai:["そのまま売るか、解体するか","古い家は「そのまま売る」「更地にして売る」で値段も費用も変わります。手入れが足りず市から「管理不全空家」として勧告を受けると、土地の固定資産税の軽減（住宅用地特例）が外れます。","https://www.mlit.go.jp/jutakukentiku/house/content/001621960.pdf","出典：国土交通省「空家等対策の推進に関する特別措置法の一部を改正する法律」概要"],
 zei:["税金の特例の期限を確かめる","相続した空き家（1981年5月31日以前に建てた家など）は、「相続から3年目の年の12月31日まで」かつ「2027年12月31日まで」に売ると、売ったもうけから最高3,000万円を差し引けます（相続人が3人以上なら1人2,000万円まで・条件あり）。くわしくは税務署・税理士へ。","https://www.nta.go.jp/taxes/shiraberu/taxanswer/joto/3306.htm","出典：国税庁 タックスアンサー No.3306"],
 satei:["いまの値段を知る","上の数字は街ぜんたいの平均です。広さ・古さ・道の広さで、お家ごとに大きく変わります。査定は無料で、売ると決めていなくても頼めます。"],
 souba:["相場だけ知っておく","上の数字が、この街の土地の値段の動きです。いざという時にあわてないよう、だいたいの値段だけ知っておくと安心です。"],
 meigi:["名義がだれか確かめる","家と土地の名義は、法務局の登記事項証明書で分かります。亡くなった方の名義のままなら、相続登記の対象です（期限があります）。","https://www.moj.go.jp/MINJI/souzokutouki-gimuka/index.html","出典：法務省「相続登記の申請義務化」"],
 honnin:["名義の方と話す","売る・貸すを決めて契約できるのは、名義の方ご本人です。まずご本人とご家族で、どうしたいかを話しておきましょう。"],
 sukoshi:["片付けを少しずつ","いる物・いらない物を、元気なうちに一緒に分けておくと、あとの片付けがぐっと楽になります。"],
 hanashi:["住んでいる方と話す","住んでいる方の次の住まいと、売る時期を先に決めましょう。相続人が何人かいる時は、全員の考えをそろえておくと後で止まりません。"],
