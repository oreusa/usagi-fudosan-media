<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>TOWN NOTES（仮）</title>
<link rel="icon" href="/assets/ogp.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Jost:wght@300..600&family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2B2622;--sub:#8C7B6E;--acc:#B5532F;--line:#E4DBD2;--bg:#FDFCFA}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:480px;margin:0 auto;padding:30px 16px 48px}
.head{text-align:center}.head img{width:52px}
.en{font-family:Jost;font-weight:400;font-size:11px;letter-spacing:.42em;color:var(--acc);margin-top:10px}
h1{font-family:"Shippori Mincho",serif;font-weight:600;font-size:25px;letter-spacing:.14em;margin:12px 0 8px}
.sub{font-size:12px;line-height:1.9;color:var(--sub);margin:0 0 20px}
.tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:0 16px;margin:0 0 10px}
.tabs button,.chips button{font-family:inherit;background:none;border:none;cursor:pointer;color:var(--sub)}
.tabs button{font-size:13.5px;font-weight:500;letter-spacing:.08em;padding:4px 0;border-bottom:1px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.chips{display:flex;justify-content:center;gap:8px;margin:0 0 14px}
.chips button{font-size:11.5px;font-weight:500;letter-spacing:.06em;border:1px solid var(--line);border-radius:14px;padding:3px 12px}
.chips button.on{color:#fff;background:var(--acc);border-color:var(--acc)}
.mapbox{position:relative;border:1px solid rgba(43,38,34,.35);background:#fff;aspect-ratio:1/1;overflow:hidden;touch-action:manipulation}
.mapbox .cn{position:absolute;font-family:Jost;font-size:9.5px;letter-spacing:.3em;color:#8A7F76;background:none;padding:0;z-index:2}
.cn.a{top:10px;left:12px}.cn.b{top:10px;right:12px}
#map{width:100%;height:100%;display:block}
.mo{fill:#FAF7F3;stroke:#E4DBD2;stroke-width:1px;vector-effect:non-scaling-stroke}
.mk{fill:#fff;stroke:var(--ink);stroke-width:1.2px;vector-effect:non-scaling-stroke;stroke-linejoin:round;cursor:pointer;transition:fill .4s}
.mk.on{fill:rgba(181,83,47,.10)}
.pin .sh{fill:rgba(43,38,34,.22)}
.pin .dot{fill:var(--acc);stroke:#fff;vector-effect:non-scaling-stroke;stroke-width:2px}
.pin .ring{fill:none;stroke:var(--acc);vector-effect:non-scaling-stroke;stroke-width:1.2px;opacity:0}
.pin.sel .ring{animation:rp 1.6s ease-out infinite}
.pin.sel .dot{fill:var(--ink)}
@keyframes rp{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}
.pin{cursor:pointer}
.pl{position:absolute;font-family:"Shippori Mincho",serif;font-size:12px;letter-spacing:.2em;color:var(--sub);pointer-events:none;transform:translate(-50%,-50%);white-space:nowrap}
.cred{text-align:right;font-size:9.5px;color:#A39A90;margin:4px 0 0}
.zoomout{position:absolute;right:10px;bottom:10px;z-index:3;font-family:inherit;font-size:11.5px;background:#fff;border:1px solid var(--ink);padding:4px 10px;cursor:pointer;display:none}
.cnt{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 12px;border-bottom:1px solid var(--ink);padding-bottom:8px}
.cnt b{font-family:"Shippori Mincho",serif;font-weight:600;font-size:17px;letter-spacing:.12em}
.cnt span{font-family:Jost;font-size:12px;color:var(--sub);letter-spacing:.1em}
.card{display:block;position:relative;background:#fff;box-shadow:0 1px 2px rgba(43,38,34,.05),0 6px 18px rgba(43,38,34,.05);padding:14px 16px 14px 18px;margin-bottom:12px;cursor:pointer}
.card.sel{box-shadow:inset 3px 0 0 var(--acc),0 6px 18px rgba(43,38,34,.08)}
.card .d{font-family:Jost;font-size:11px;letter-spacing:.1em;color:#A88C76}
.card .t{font-family:"Shippori Mincho",serif;font-weight:600;font-size:16px;line-height:1.5;margin:4px 0 2px}
.card .m{font-size:11.5px;color:var(--sub)}
.card .pf{position:absolute;right:14px;top:14px;font-size:10px;letter-spacing:.1em;border:1px solid var(--ink);padding:0 6px}
.tg{display:inline-block;font-size:9.5px;border:1px solid var(--ink);padding:0 5px;margin-left:6px;letter-spacing:.08em;vertical-align:1px}
.more{display:block;margin:4px auto 0;font-family:inherit;font-size:12.5px;background:none;border:none;border-bottom:1px solid var(--ink);padding:2px 0;cursor:pointer;color:var(--ink)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.sheet.open{transform:none;pointer-events:auto}
.sheet .in{max-width:480px;margin:0 auto;background:var(--bg);border-top:1px solid var(--ink);box-shadow:0 -10px 30px rgba(43,38,34,.12);padding:16px 16px 22px;max-height:62vh;overflow:auto}
.sheet .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sheet .top span{font-family:Jost;font-size:10.5px;letter-spacing:.38em;color:var(--acc)}
.sheet .x{font-family:Jost;font-size:20px;background:none;border:none;cursor:pointer;color:var(--ink);line-height:1}
.sheet .card{cursor:default}
.btns{display:flex;gap:14px;margin-top:10px}
.btns a{font-size:11.5px;font-weight:500;letter-spacing:.1em;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--ink)}
.btns a:after{content:" ↗";font-family:Jost}
.ft{text-align:center;font-size:10.5px;color:var(--sub);margin-top:28px;line-height:2}
.ft a{color:var(--ink)}
.empty{font-size:12.5px;color:var(--sub);text-align:center;padding:20px 0}
.proto{position:fixed;top:8px;left:8px;z-index:30;font-family:Jost;font-size:10px;letter-spacing:.2em;background:var(--ink);color:#fff;padding:2px 8px}
</style></head><body>
<div class="proto">PROTOTYPE</div>
<div class="wrap">
<div class="head"><img src="/assets/logo.png" alt="うさぎ│TOWN NOTES"><div class="en">TOWN NOTES</div>
<h1>関西おでかけマップ</h1><p class="sub">不動産屋が街の調査で見つけたおでかけ先を、<br>地図にピンで残しています。</p></div>
<div class="tabs" id="tabs"></div>
<div class="chips" id="chips"><button data-c="now">開催中</button><button data-c="we">今週末</button><button data-c="free">無料</button></div>
<div class="mapbox"><span class="cn a">KANSAI</span><span class="cn b" id="cnb">ALL</span>__SVG__<div id="labels"></div><button class="zoomout" id="zo">関西全体にもどる</button></div>
<p class="cred">地図：mapsvg.com（CC BY 4.0）</p>
<div class="cnt"><b id="ch">関西のおでかけ</b><span id="cc"></span></div>
<div id="list"></div>
<p class="ft">TOWN NOTES は仮の名前です。<br><a href="/">今のおでかけリストへ</a></p>
</div>
<div class="sheet" id="sheet"><div class="in"><div class="top"><span id="sht">PIN</span><button class="x" id="shx" aria-label="閉じる">×</button></div><div id="shl"></div></div></div>
<script>
(function(){
var $=function(i){return document.getElementById(i)},NS="http://www.w3.org/2000/svg";
var PREFS=["大阪","京都","兵庫","奈良","滋賀","和歌山"],PID={"大阪":"osaka","京都":"kyoto","兵庫":"hyogo","奈良":"nara","滋賀":"shiga","和歌山":"wakayama"};
var HOME=[200.5,251,60,60],vb=HOME.slice(),pref="",chip="",sel=null,items=[],shown=10;
// リールと同じ式（緯度経度→地図の座標）
function X(lon){return 19.72*lon-2438.3}function Y(lat){return 255.75+(35.67-lat)*23.36}
var td=new Date(Date.now()+9*36e5).toISOString().slice(0,10);
function weekend(){var d=new Date(td+"T00:00:00Z"),w=d.getUTCDay(),s=new Date(d);s.setUTCDate(d.getUTCDate()+((6-w+7)%7));var u=new Date(s);u.setUTCDate(s.getUTCDate()+1);if(w===0){s=d;u=d}return[s.toISOString().slice(0,10),u.toISOString().slice(0,10)]}
var WE=weekend();
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
// タブ
var tb=$("tabs");[""].concat(PREFS).forEach(function(p){var b=document.createElement("button");b.textContent=p||"全部";b.dataset.p=p;if(!p)b.className="on";b.onclick=function(){setPref(p)};tb.appendChild(b)});
document.querySelectorAll("#chips button").forEach(function(b){b.onclick=function(){chip=chip===b.dataset.c?"":b.dataset.c;document.querySelectorAll("#chips button").forEach(function(x){x.classList.toggle("on",x.dataset.c===chip)});shown=10;draw(true)}});
document.querySelectorAll(".mk").forEach(function(e){e.addEventListener("click",function(){if(!pref)setPref(e.dataset.pref)})});
$("zo").onclick=function(){setPref("")};$("shx").onclick=closeSheet;
function setPref(p){pref=p;document.querySelectorAll("#tabs button").forEach(function(x){x.classList.toggle("on",x.dataset.p===p)});
 document.querySelectorAll(".mk").forEach(function(e){e.classList.toggle("on",e.dataset.pref===p)});
 $("zo").style.display=p?"block":"none";$("cnb").textContent=p?PID[p].toUpperCase():"ALL";
 var to=HOME;if(p){var bb=$("p_"+PID[p]).getBBox(),s=Math.max(bb.width,bb.height)*1.18;to=[bb.x+bb.width/2-s/2,bb.y+bb.height/2-s/2,s,s]}
 closeSheet();shown=10;fly(to);draw(true)}
// 地図をなめらかに寄せる
var anim=null;function fly(to){var from=vb.slice(),t0=performance.now(),D=700;cancelAnimationFrame(anim);
 (function st(n){var k=Math.min(1,(n-t0)/D),e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;vb=from.map(function(v,i){return v+(to[i]-v)*e});apply();if(k<1)anim=requestAnimationFrame(st)})(t0)}
function apply(){$("map").setAttribute("viewBox",vb.join(" "));var r=vb[2]/60;
 document.querySelectorAll(".pin").forEach(function(g){g.setAttribute("transform","translate("+g.dataset.x+" "+g.dataset.y+") scale("+r+")")});labels()}
function labels(){var L=$("labels");L.innerHTML="";if(pref)return;var box=$("map").getBoundingClientRect(),m=$("map").getScreenCTM();if(!m)return;
 PREFS.forEach(function(p){var bb=$("p_"+PID[p]).getBBox(),pt=$("map").createSVGPoint();pt.x=bb.x+bb.width*(p==="兵庫"?.4:.5);pt.y=bb.y+bb.height*(p==="兵庫"?.3:p==="京都"?.25:.5);var q=pt.matrixTransform(m);
  var s=document.createElement("div");s.className="pl";s.textContent=p;s.style.left=(q.x-box.left)+"px";s.style.top=(q.y-box.top)+"px";L.appendChild(s)})}
function match(it){if(pref&&it.pref!==pref)return false;if(chip==="now")return it.s<=td;if(chip==="we")return it.s<=WE[1]&&it.e>=WE[0];if(chip==="free")return it.free;return true}
// ピンを立てる（寄せたときだけ、上から落ちてくる）
function draw(drop){var g=$("pins");g.innerHTML="";var vis=items.filter(match),n=0;
 vis.forEach(function(it){if(it.lat==null)return;var p=document.createElementNS(NS,"g");p.setAttribute("class","pin"+(sel===it?" sel":""));p.dataset.x=X(it.lon);p.dataset.y=Y(it.lat);
  p.innerHTML='<ellipse class="sh" cx="0" cy=".5" rx=".9" ry=".3"/><circle class="ring" r=".9"/><g class="dw"><circle class="dot" r=".9"/></g>';
  p.querySelector(".ring").style.transformOrigin="0 0";
  p.addEventListener("click",function(ev){ev.stopPropagation();pick(it)});g.appendChild(p);
  if(drop){var dw=p.querySelector(".dw"),d=Math.min(n++*25,600);dw.animate([{transform:"translateY(-6px)",opacity:0},{transform:"translateY(0)",opacity:1,offset:.6},{transform:"translateY(-.8px)",offset:.8},{transform:"translateY(0)",opacity:1}],{duration:520,delay:d,easing:"ease-out",fill:"backwards"})}});
 apply();list(vis)}
function card(it,full){var tag=it.free?'<span class="tg">無料</span>':"";
 var h='<div class="d">'+esc(it.d)+tag+'</div><div class="t">'+esc(it.t)+'</div><div class="m">'+esc(it.m)+'</div><span class="pf">'+esc(it.pref)+'</span>';
 if(full)h+='<div class="btns"><a href="'+esc(it.href)+'" target="_blank" rel="noopener">公式ページ</a><a href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(it.map||it.t)+'" target="_blank" rel="noopener">行き方</a></div>';return h}
function list(vis){$("ch").textContent=(pref||"関西")+"のおでかけ";$("cc").textContent=vis.length+" SPOTS";var L=$("list");L.innerHTML="";
 if(!vis.length){L.innerHTML='<p class="empty">この条件のおでかけは、いまはありません。</p>';return}
 vis.slice(0,shown).forEach(function(it){var c=document.createElement("div");c.className="card"+(sel===it?" sel":"");c.innerHTML=card(it);c.onclick=function(){pick(it,true)};L.appendChild(c)});
 if(vis.length>shown){var b=document.createElement("button");b.className="more";b.textContent="もっと見る（あと"+(vis.length-shown)+"件）";b.onclick=function(){shown+=10;list(vis)};L.appendChild(b)}}
// ピンを押す：近くのピンもまとめてシートに出す
function pick(it,fromList){sel=it;var vis=items.filter(match).filter(function(o){return o.lat!=null});
 var thr=vb[2]/60*1.6,near=vis.filter(function(o){return Math.hypot(X(o.lon)-X(it.lon),Y(o.lat)-Y(it.lat))<thr});
 if(fromList&&it.lat!=null){var w=Math.min(vb[2],pref?vb[2]:30);fly([X(it.lon)-w/2,Y(it.lat)-w/2,w,w]);$("zo").style.display="block"}
 near.sort(function(a,b){return a===it?-1:b===it?1:0});
 $("sht").textContent=near.length>1?"この辺りに "+near.length+" 件":"PIN";
 $("shl").innerHTML=(near.length?near:[it]).map(function(o){return '<div class="card">'+card(o,true)+'</div>'}).join("");
 $("sheet").classList.add("open");draw(false)}
function closeSheet(){$("sheet").classList.remove("open");if(sel){sel=null;draw(false)}}
$("map").addEventListener("click",function(e){if(e.target.closest&&!e.target.closest(".pin")&&pref)closeSheet()});
window.addEventListener("resize",labels);
// 今のおでかけリスト（トップページ）からカードを読む。場所は geo.json
Promise.all([fetch("/",{cache:"no-store"}).then(function(r){return r.text()}),fetch("geo.json",{cache:"no-store"}).then(function(r){return r.ok?r.json():{}}).catch(function(){return{}})]).then(function(a){
 var doc=new DOMParser().parseFromString(a[0],"text/html"),geo=a[1],seen={};
 doc.querySelectorAll("a.card").forEach(function(c){var t=c.querySelector(".t");if(!t)return;var ti=t.textContent.trim();if(seen[ti])return;seen[ti]=1;
  var e=c.dataset.e||"9999-12-31",s=c.dataset.s||"0000";if(e<td)return;if(c.classList.contains("nw")||c.classList.contains("dn"))return;
  var g=geo[ti]||[];items.push({t:ti,d:(c.querySelector(".d")||{}).textContent||"",m:(c.querySelector(".m")||{}).textContent||"",pref:c.dataset.pref||"",free:/無料/.test(c.dataset.tag||""),s:s,e:e,map:c.dataset.map||"",href:c.getAttribute("href")||"#",lat:g[0],lon:g[1]})});
 items.sort(function(a,b){return a.e<b.e?-1:1});draw(true)});
})();
</script></body></html>
