<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:MB;src:url(fonts/ShipporiMincho-Bold.ttf)}@font-face{font-family:MM;src:url(fonts/ShipporiMincho-Medium.ttf)}
html,body{margin:0;width:925px;height:1425px;overflow:hidden;background:#000}
#c{position:absolute;inset:0;overflow:hidden;border-radius:6px 10px 10px 6px}
#im{position:absolute;inset:-2%;background-size:cover;background-position:50% 50%;filter:saturate(1.08) contrast(1.05) brightness(.82)}
#sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,4,3,.78) 0%,rgba(6,4,3,.35) 16%,rgba(6,4,3,.05) 32%,rgba(6,4,3,.05) 52%,rgba(6,4,3,.82) 100%)}
#vg{position:absolute;inset:0;box-shadow:inset 0 0 160px 40px rgba(0,0,0,.55)}
#sp{position:absolute;left:0;top:0;bottom:0;width:46px;background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(255,255,255,.10) 55%,rgba(0,0,0,.18) 70%,rgba(0,0,0,0))}
#fr{position:absolute;inset:38px 38px 38px 64px;border:1.5px solid rgba(232,204,150,.85)}
#fr:after{content:'';position:absolute;inset:9px;border:1px solid rgba(232,204,150,.45)}
#top{position:absolute;left:64px;right:38px;top:96px;text-align:center;color:#f3dfb2;font:700 26px MB;letter-spacing:.42em;text-shadow:0 2px 14px rgba(0,0,0,.85),0 0 2px rgba(0,0,0,.6)}
#dt{position:absolute;left:64px;right:38px;top:140px;text-align:center;color:rgba(255,246,226,.95);font:500 28px MM;letter-spacing:.3em;text-shadow:0 2px 14px rgba(0,0,0,.85)}
#tt{position:absolute;left:64px;right:38px;bottom:300px;text-align:center;color:#fff8ea;font:700 120px MB;letter-spacing:.1em;text-shadow:0 4px 40px rgba(0,0,0,.6),0 0 2px rgba(0,0,0,.4)}
#st{position:absolute;left:64px;right:38px;bottom:236px;text-align:center;color:#f1dcae;font:500 40px MM;letter-spacing:.22em;text-shadow:0 2px 18px rgba(0,0,0,.6)}
#ln{position:absolute;left:50%;bottom:205px;width:260px;margin-left:-118px;height:1px;background:linear-gradient(90deg,transparent,#e8cc96,transparent)}
#br{position:absolute;left:64px;right:38px;bottom:104px;text-align:center;color:rgba(255,240,214,.88);font:500 24px MM;letter-spacing:.3em}
#lg{position:absolute;left:50%;bottom:142px;width:44px;height:44px;margin-left:-9px;border-radius:50%;background:#f6ecd8 center/86% no-repeat;box-shadow:0 0 0 1.5px rgba(232,204,150,.9)}
#gl{position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,0) 35%,rgba(255,255,255,.07) 48%,rgba(255,255,255,0) 60%)}
</style></head><body><div id="c"><div id="im"></div><div id="sh"></div><div id="vg"></div><div id="gl"></div><div id="sp"></div><div id="fr"></div>
<div id="top"></div><div id="dt"></div><div id="tt"></div><div id="st"></div><div id="ln"></div><div id="lg"></div><div id="br"></div></div>
<script>const Q=new URLSearchParams(location.search);
document.getElementById('im').style.backgroundImage=`url(${Q.get('img')})`;document.getElementById('im').style.backgroundPosition=Q.get('pos')||'50% 50%';
for(const k of ['top','dt','tt','st','br'])document.getElementById(k).textContent=Q.get(k)||'';
document.getElementById('lg').style.backgroundImage=`url(${Q.get('logo')})`;
document.fonts.ready.then(()=>window.ready=1)</script></body></html>
