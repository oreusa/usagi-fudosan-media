 // huts

  box(.05,1,1.8,winM,x-s*1.31,1.25,z);
  for(let i=0;i<30;i++){const t=i/29;lights.push([x-s*1.35,2.15+Math.sin(t*Math.PI)*-.15,z-1.3+t*2.6,'#ffcf80',1.2])}
  const pl=new THREE.PointLight('#ffa850',5,7,1.6);pl.position.set(x-s*2,1.4,z);scene.add(pl)}

 points(lights,.13);

}
